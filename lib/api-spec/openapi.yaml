openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analysis
    description: Suspicious message and email analysis
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /analysis/providers:
    get:
      operationId: getAnalysisProviders
      tags: [analysis]
      summary: Get configured reputation providers
      responses:
        "200":
          description: Provider availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderStatus"
  /analysis:
    post:
      operationId: analyzeContent
      tags: [analysis]
      summary: Analyze an SMS or raw email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeInput"
      responses:
        "200":
          description: Analysis completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /triage/voice:
    post:
      operationId: triageVoice
      tags: [analysis]
      summary: Analyze a voice transcript or transcribe an audio recording
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceTranscriptInput"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/VoiceAudioInput"
      responses:
        "200":
          description: Voice triage completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceTriageResult"
        "400":
          description: Invalid voice triage input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Audio exceeds the upload limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Unsupported audio format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Transcription provider could not process the audio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    AnalyzeInput:
      type: object
      properties:
        source:
          type: string
          enum: [sms, email]
        content:
          type: string
          minLength: 1
          maxLength: 100000
      required: [source, content]
    VoiceTranscriptInput:
      type: object
      properties:
        transcript:
          type: string
          minLength: 1
          maxLength: 100000
      required: [transcript]
    VoiceAudioInput:
      type: object
      properties:
        audio:
          type: string
          format: binary
          description: MP3, WAV, or M4A audio, up to 24 MiB
      required: [audio]
    VoiceTriageResult:
      type: object
      properties:
        source:
          type: string
          enum: [voice]
        analyzedAt:
          type: string
          format: date-time
        transcriptionMode:
          type: string
          enum: [provided, openai_whisper, mock_fallback]
        transcript:
          type: string
          maxLength: 100000
        riskScore:
          type: integer
          minimum: 0
          maximum: 100
        riskLevel:
          type: string
          enum: [low, moderate, high, critical]
        summary:
          type: string
        vishingIndicators:
          type: array
          items:
            $ref: "#/components/schemas/VishingIndicator"
        factors:
          type: array
          items:
            $ref: "#/components/schemas/RiskFactor"
        findings:
          type: array
          items:
            type: string
      required:
        - source
        - analyzedAt
        - transcriptionMode
        - transcript
        - riskScore
        - riskLevel
        - summary
        - vishingIndicators
        - factors
        - findings
    VishingIndicator:
      type: object
      properties:
        category:
          type: string
          enum: [authority_impersonation, fear_urgency, high_risk_demand]
        label:
          type: string
        quotes:
          type: array
          items:
            type: string
        detail:
          type: string
      required: [category, label, quotes, detail]
    ProviderStatus:
      type: object
      properties:
        configured:
          type: boolean
        provider:
          type: ["string", "null"]
          enum: [virustotal, google_safe_browsing, null]
      required: [configured, provider]
    AnalysisResult:
      type: object
      properties:
        source:
          type: string
          enum: [sms, email]
        analyzedAt:
          type: string
          format: date-time
        riskScore:
          type: integer
          minimum: 0
          maximum: 100
        riskLevel:
          type: string
          enum: [low, moderate, high, critical]
        summary:
          type: string
        indicators:
          type: array
          items:
            $ref: "#/components/schemas/Indicator"
        urgencyFlags:
          type: array
          items:
            type: string
        authChecks:
          type: array
          items:
            $ref: "#/components/schemas/AuthCheck"
        authOverall:
          type: string
          enum: [not_applicable, pass, mixed, fail, unavailable]
        dnsAuthObservations:
          type: array
          items:
            $ref: "#/components/schemas/DnsAuthObservation"
        factors:
          type: array
          items:
            $ref: "#/components/schemas/RiskFactor"
        findings:
          type: array
          items:
            type: string
        reputationConfigured:
          type: boolean
        reputationProvider:
          type: ["string", "null"]
          enum: [virustotal, google_safe_browsing, null]
      required:
        - source
        - analyzedAt
        - riskScore
        - riskLevel
        - summary
        - indicators
        - urgencyFlags
        - authChecks
        - authOverall
        - dnsAuthObservations
        - factors
        - findings
        - reputationConfigured
        - reputationProvider
    Indicator:
      type: object
      properties:
        kind:
          type: string
          enum: [url, domain, ip, phone]
        value:
          type: string
        reputation:
          type: string
          enum: [safe, suspicious, malicious, unknown]
        reputationDetail:
          type: string
        redirectChain:
          type: array
          items:
            type: string
        shortener:
          type: boolean
        anchorMismatch:
          type: boolean
      required: [kind, value, reputation, reputationDetail, redirectChain, shortener, anchorMismatch]
    AuthCheck:
      type: object
      properties:
        mechanism:
          type: string
          enum: [spf, dkim, dmarc]
        status:
          type: string
          enum: [pass, fail, neutral, unknown]
        aligned:
          type: ["boolean", "null"]
        domain:
          type: ["string", "null"]
        detail:
          type: string
      required: [mechanism, status, aligned, domain, detail]
    DnsAuthObservation:
      type: object
      properties:
        mechanism:
          type: string
          enum: [spf, dkim, dmarc]
        status:
          type: string
          enum: [published, not_found, timed_out, unavailable, not_checked]
        domain:
          type: ["string", "null"]
        selector:
          type: ["string", "null"]
        lookupName:
          type: ["string", "null"]
        targetSource:
          type: string
          enum: [return-path, authentication-results, received-spf, from, dkim-signature, missing]
        records:
          type: array
          maxItems: 5
          items:
            type: string
            maxLength: 2048
        detail:
          type: string
      required: [mechanism, status, domain, selector, lookupName, targetSource, records, detail]
    RiskFactor:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        points:
          type: integer
          minimum: 0
        triggered:
          type: boolean
        detail:
          type: string
      required: [id, label, points, triggered, detail]

